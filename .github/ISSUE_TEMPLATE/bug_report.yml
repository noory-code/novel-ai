name: Bug report
description: Report a reproducible problem in one novel-ai plugin
title: "bug(<plugin>): "
labels:
  - bug
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - mashbill
        - solera
        - proof
        - distill
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Use the version from the plugin manifest.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the smallest deterministic sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, host application, and relevant dependency versions.
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Public disclosure check
      options:
        - label: This report does not disclose a security vulnerability.
          required: true
