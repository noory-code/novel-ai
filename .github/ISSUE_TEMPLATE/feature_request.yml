name: Feature proposal
description: Propose a focused improvement to one plugin or a documented cross-package contract
title: "feat(<plugin>): "
labels:
  - enhancement
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - mashbill
        - solera
        - proof
        - distill
        - cross-package contract
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: State observable acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Package-boundary impact
      description: Explain any file-format or stable-identifier changes. State "none" when isolated.
    validations:
      required: true
