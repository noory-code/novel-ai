name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/validate_repository.py

  package-tests:
    strategy:
      fail-fast: false
      matrix:
        package: [mashbill, solera, proof, distill]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: plugins/${{ matrix.package }}/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run pytest -q

  # Solera's workspace lock has one code path per OS family (fcntl on POSIX,
  # msvcrt on Windows). Run the lock and workspace tests where each path runs.
  # The rest of the Solera suite uses POSIX gate commands such as `true`.
  solera-workspace-lock:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/solera
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: plugins/solera/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run pytest -q tests/test_workspace_lock.py tests/test_workspace.py
