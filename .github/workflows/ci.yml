name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/validate_repository.py

  package-tests:
    strategy:
      fail-fast: false
      matrix:
        package: [mashbill, solera, proof, distill]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: plugins/${{ matrix.package }}/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run pytest -q
