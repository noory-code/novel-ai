[project]
name = "mashbill"
dynamic = ["version"]  # single source = mashbill/__init__.py::__version__ (D-2026-06-20-N)
description = "Novel — freeform mindmap canvas + MCP server. AI-assisted visual thinking workspace that stores sketches as JSON under .plot/ and exposes them to Claude Code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
keywords = ["claude-code", "mcp", "plot", "mindmap", "canvas", "reactflow"]
dependencies = [
    "fastmcp>=2.0",
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "watchdog>=4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # Track 2.5 (D-2026-06-11-E) — write external CLI configs (Codex uses
    # TOML; stdlib's `tomllib` reads but does not write).
    "tomli-w>=1.0",
]

[project.scripts]
mashbill = "mashbill.__main__:main"
mashbill-http = "mashbill.__main__:http_only"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "mashbill/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mashbill"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.10",
    "ruff>=0.8",
    "httpx>=0.28.1",
]
