[project]
name = "proof"
version = "0.4.0"
description = "Proof — an append-only decision log. A shared substrate both Plot and Solera point at by id: each decision records its context, choice, alternatives, and consequences, and supersession is a relation between entries, never an edit. Standalone, plain files under .noory/proof/."
readme = "README.md"
license = "MIT"
keywords = ["decision-log", "adr", "claude-code", "harness", "proof"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
proof = "proof.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proof"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]
