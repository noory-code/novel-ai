[project]
name = "solera"
version = "7.3.1"
description = "Solera — a slim harness that plans work, runs deterministic gates, and orders the steps an external AI agent executes. Reads and writes a plain-file .noory/solera/ workspace. Works standalone, with or without Plot."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
keywords = ["claude-code", "harness", "solera", "agent", "planning", "gate"]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
solera = "solera.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solera"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "mypy>=1.10",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]
